name: Refresh rankings and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rankings-and-pages
  cancel-in-progress: false

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Require the Bangumi token
        env:
          BANGUMI_ACCESS_TOKEN: ${{ secrets.BANGUMI_ACCESS_TOKEN }}
        run: |
          if [ -z "$BANGUMI_ACCESS_TOKEN" ]; then
            echo "Add BANGUMI_ACCESS_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - run: npm ci
      - name: Validate committed files
        run: npm run validate:data
      - name: Fetch source scores and rebuild static data
        run: npm run update:data
        env:
          BANGUMI_ACCESS_TOKEN: ${{ secrets.BANGUMI_ACCESS_TOKEN }}
      - name: Validate refreshed rankings
        run: npm run validate:synced-data
      - name: Check and build
        run: npm run check
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json public/data/rankings.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh visual novel scores"
            if ! git push; then
              echo "::warning::main changed during the refresh; deploying the refreshed data without committing it"
            fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh-and-build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
